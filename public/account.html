<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account | Star Gold Limited</title><meta name="description" content="Sign in to track orders, manage your delivery addresses and save your favourite pieces from Star Gold Limited.">
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/pages.css"><link rel="icon" href="assets/mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head><body data-page="account">
<div id="siteHeader"></div>
<main class="container">
<div class="breadcrumb"><a href="/">Home</a> / <span>Account</span></div>
<div class="auth-wrap" id="authWrap" hidden>
<div class="auth-card">
<div class="auth-tabs" id="authTabs"><button class="is-active" data-auth-tab="login">Sign in</button><button data-auth-tab="register">Create account</button></div>
<form class="auth-form" id="authForm">
<div class="field" id="nameField" hidden><label class="field__label">Full name</label><input class="input" name="name" autocomplete="name" placeholder="Your name"></div>
<div class="field"><label class="field__label">Email address</label><input class="input" name="email" type="email" autocomplete="email" placeholder="you@email.com" required></div>
<div class="field"><label class="field__label">Password</label><input class="input" name="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" required></div>
<div class="field" id="phoneField" hidden><label class="field__label">Phone number</label><input class="input" name="phone" autocomplete="tel" placeholder="0806 349 4273"></div>
<button class="btn btn--block" type="submit" id="authSubmit">Sign in</button>
<p class="auth-alt" id="authMsg"></p>
</form>
</div></div>
<div class="account-layout" id="dashWrap" hidden>
<aside class="account-nav" id="accountNav"></aside>
<div class="account-panel" id="accountPanel"></div>
</div>
</main>
<div id="siteFooter"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/chrome.js"></script><script src="js/account.js"></script>
</body></html>
